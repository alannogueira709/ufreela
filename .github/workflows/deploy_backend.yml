name: Build e Deploy do Backend no Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy_backend.yml"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: southamerica-east1
  SERVICE_NAME: ufreela-backend
  ARTIFACT_REGISTRY_REPO: ufreela-backend
  IMAGE_NAME: ufreela-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions@ufreela-501113.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: --allow-unauthenticated --port=8080 --memory=1Gi --cpu=1 --concurrency=80 --max-instances=10
          env_vars: |
            DEBUG=False
            DJANGO_SETTINGS_MODULE=core.settings
            ACCOUNT_EMAIL_VERIFICATION=mandatory
            ALLOWED_HOSTS=api.ufreela.com.br,.a.run.app,.southamerica-east1.run.app
            AUTH_COOKIE_SECURE=1
            CORS_ALLOWED_ORIGINS=https://ufreela.com.br,https://www.ufreela.com.br
            CSRF_TRUSTED_ORIGINS=https://ufreela.com.br,https://www.ufreela.com.br
            FRONTEND_URL=https://ufreela.com.br
          secrets: |
            DJANGO_SECRET_KEY=django-secret-key:latest
            DATABASE_URL=database-url:latest
            FIELD_ENCRYPTION_KEY=field-encryption-key:latest
            REDIS_URL=redis-url:latest
            STRIPE_SECRET_KEY=stripe-secret-key:latest
            STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest
            GOOGLE_CLIENT_ID=google-client-id:latest
            GOOGLE_CLIENT_SECRET=google-client-secret:latest
            GITHUB_CLIENT_ID=github-client-id:latest
            GITHUB_CLIENT_SECRET=github-client-secret:latest
            RESEND_API_KEY=resend-api-key:latest
            RESEND_FROM_EMAIL=resend-from-email:latest

      - name: Show deploy URL
        run: echo "Deploy realizado em ${{ steps.deploy.outputs.url }}"

      - name: Run migrations
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "Criando/atualizando job de migration..."
          gcloud run jobs update django-migrate \
            --image=$IMAGE \
            --region=${{ env.GCP_REGION }} \
            --set-secrets=DJANGO_SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest,FIELD_ENCRYPTION_KEY=field-encryption-key:latest \
            --set-env-vars=DJANGO_SETTINGS_MODULE=core.settings,DEBUG=False \
            --command=python,manage.py,migrate \
            --max-retries=1 || \
          gcloud run jobs create django-migrate \
            --image=$IMAGE \
            --region=${{ env.GCP_REGION }} \
            --set-secrets=DJANGO_SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest,FIELD_ENCRYPTION_KEY=field-encryption-key:latest \
            --set-env-vars=DJANGO_SETTINGS_MODULE=core.settings,DEBUG=False \
            --command=python,manage.py,migrate \
            --max-retries=1
          echo "Executando migration..."
          gcloud run jobs execute django-migrate --region=${{ env.GCP_REGION }} --wait
