<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uFreela</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f7fb; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f7fb; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 32px; overflow: hidden; box-shadow: 0 24px 70px -40px rgba(15, 23, 42, 0.22);">
          <tr>
            <td style="background-color: #0f172a; padding: 32px 40px; text-align: center;">
              <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;">
                uFreela<span style="color: #2563eb;">.</span>
              </h1>
            </td>
          </tr>

          {% block content %}{% endblock %}

          <tr>
            <td style="padding: 32px 40px; text-align: center; border-top: 1px solid #e2e8f0;">
              <p style="margin: 0 0 8px; font-size: 13px; color: #94a3b8; line-height: 1.5;">
                © 2026 uFreela. Todos os direitos reservados.
              </p>
              <p style="margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.5;">
                <a href="{{ frontend_url }}" style="color: #2563eb; text-decoration: none;">ufreela.com.br</a>
                &nbsp;•&nbsp;
                <a href="mailto:contato@ufreela.com.br" style="color: #2563eb; text-decoration: none;">Contato</a>
              </p>
            </td>
          </tr>
        </table>
        <p style="margin: 16px 0 0; font-size: 12px; color: #94a3b8;">
          Este e-mail foi enviado automaticamente. Por favor, não responda a esta mensagem.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
